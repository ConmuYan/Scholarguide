<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScholarGuide · 使用 ChatGPT 账号登录</title>
<link rel="stylesheet" href="/oauth.css">
</head>
<body>
<main>
  <h1>使用 ChatGPT 账号登录</h1>
  <p class="lead">浏览器完成授权后无法自动回到本服务，把地址栏里的链接粘回来即可完成登录。凭据只保存在当前实例。</p>

  <section>
    <h2>1. 打开授权页</h2>
    <div class="row">
      <button id="begin">获取授权链接</button>
      <button id="open" class="secondary" disabled>在新标签打开</button>
    </div>
    <div class="status" id="begin-status"></div>
    <div class="row" id="link-row" hidden>
      <input id="auth-url" readonly>
    </div>
  </section>

  <section>
    <h2>2. 粘贴回跳地址</h2>
    <p class="hint">授权后浏览器会跳到 <code>http://127.0.0.1:1455/...</code>，页面打不开是正常的；复制那整条地址粘到下面。</p>
    <textarea id="callback" placeholder="http://127.0.0.1:1455/auth/callback?code=...&state=..."></textarea>
    <div class="row">
      <button id="complete">完成登录</button>
    </div>
    <div class="status" id="complete-status"></div>
    <p class="hint" id="next-step" hidden>登录完成，正在前往设置选择模型…</p>
  </section>

</main>
<script src="/oauth.js" defer></script>
</body>
</html>
