name: Build versioned release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Test release allow-list and offline demo
        run: python -m unittest discover -s tests -p 'test_release_package.py' -v
      - name: Build clean source bundle and installers
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_VERSION: ${{ github.ref_name }}
        run: python scripts/build_release.py --repository "$GH_REPOSITORY" --version "$GH_VERSION" --out dist
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_VERSION: ${{ github.ref_name }}
        run: gh release create "$GH_VERSION" dist/* --verify-tag --generate-notes
